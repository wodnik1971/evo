<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<title>RELATUS — Rela</title>
<style>
:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#1f2522;--muted:#6e756f;--line:#ddd5ca;--green:#293b34;--green2:#62786d;--burg:#7a4f5e;--ok:#4d725d;--danger:#9b3b3b;--shadow:0 18px 44px rgba(34,40,36,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(760px,100%);margin:auto;padding:16px 14px 100px}.top{position:sticky;top:0;z-index:20;background:rgba(245,241,234,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.topin{width:min(760px,100%);margin:auto;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.tiny{font-size:.78rem;color:var(--muted)}.hero{display:grid;gap:14px}.photo{position:relative;overflow:hidden;border-radius:28px;min-height:430px;background:#ddd;box-shadow:var(--shadow)}.photo img{width:100%;height:100%;min-height:430px;max-height:610px;display:block;object-fit:cover;object-position:center 24%}.photo:after{content:'';position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(24,31,28,.84))}.photoText{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}.photoText .eyebrow{color:rgba(255,255,255,.8)}h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:6px 0}h2{line-height:1.15}.eyebrow{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.stack{display:grid;gap:12px}.btn{border:0;border-radius:15px;padding:12px 15px;font-weight:800}.primary{background:var(--green);color:white}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.soft{background:#ece7df;color:var(--green)}.danger{background:#fff4f4;color:var(--danger);border:1px solid #e4c6c6}.entry{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{border-left:4px solid var(--ok);background:#f1f6f2;border-radius:12px;padding:11px 13px}.field{display:grid;gap:6px}.field input,.composer textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;outline:none}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,249,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);font-size:.72rem;padding:6px 2px}.nav button.active{color:var(--green);font-weight:900}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.15)}.relaHead{display:flex;gap:11px;align-items:center}.relaFocus{background:linear-gradient(180deg,#fffdf9,#f7f2eb);border:1px solid var(--line);border-radius:26px;padding:17px;box-shadow:var(--shadow)}.chat{display:grid;gap:12px;margin:14px 0}.msg{max-width:88%;padding:12px 14px;border-radius:18px;white-space:pre-wrap}.user{justify-self:end;background:var(--green);color:white;border-bottom-right-radius:6px}.rela{justify-self:start;background:white;border:1px solid var(--line);border-bottom-left-radius:6px}.meta{font-size:.7rem;color:var(--muted);margin:0 6px -6px}.composer{position:sticky;bottom:82px;background:rgba(255,253,249,.98);border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:var(--shadow)}.composerRow{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:end}.round{width:46px;height:46px;border:0;border-radius:14px}.mic{background:#ece7df}.mic.listening{background:#f4dddd;color:var(--danger)}.send{background:var(--green);color:#fff}.voiceStatus{font-size:.76rem;color:var(--muted);padding:5px 5px 0}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:14px;border:1px solid var(--line);border-radius:18px;background:white;text-align:left}.tile small{display:block;color:var(--muted);margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{font-size:.75rem;padding:5px 9px;border-radius:999px;background:#eee7df}.timeline{display:grid;gap:12px}.event{border-left:3px solid var(--line);padding-left:12px}.modal{position:fixed;inset:0;z-index:100;background:rgba(15,20,18,.45);display:grid;place-items:end center}.sheet{width:min(680px,100%);max-height:85dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 28px}.close{float:right;border:0;background:#e9e3da;border-radius:10px;padding:7px 10px}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:120;background:#202622;color:white;padding:10px 14px;border-radius:12px;max-width:90vw}.switch{accent-color:var(--green)}@media(max-width:620px){.photo{min-height:390px}.photo img{min-height:390px}.tiles{grid-template-columns:1fr}.entry{grid-template-columns:1fr 1fr}}
</style>
</head><body><div id="app"></div>
<script>
const KEY='relatus_app_stage_v21';
const base={onboarded:false,screen:'today',relation:'Moja relacja',messages:[],events:[],compass:[],stage:'replay',safety:false,pattern:'',positive:[],counter:[],voice:true};
let state={...base};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
const $=q=>document.querySelector(q),root=()=>$('#app'),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function speak(t){if(!state.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';u.rate=.96;const v=speechSynthesis.getVoices().find(x=>x.lang?.toLowerCase().startsWith('pl'));if(v)u.voice=v;speechSynthesis.speak(u)}catch{}}
function listen(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Rozpoznawanie mowy wymaga Chrome lub Edge.');return}const input=document.getElementById(id);if(!input)return;const rec=new SR();rec.lang='pl-PL';rec.interimResults=true;const mic=document.querySelector('.mic'),vs=document.querySelector('.voiceStatus');mic?.classList.add('listening');if(vs)vs.textContent='Słucham…';rec.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const x=e.results[n][0].transcript;e.results[n].isFinal?f+=x:i+=x}input.value=(f||i).trim()};rec.onerror=()=>{if(vs)vs.textContent='Nie udało się użyć mikrofonu.'};rec.onend=()=>{mic?.classList.remove('listening');if(vs&&vs.textContent==='Słucham…')vs.textContent='Głos zamieniony na tekst — możesz wysłać.'};try{rec.start()}catch{}}
function nav(content,active){root().innerHTML=`<div class="top"><div class="topin"><div class="brand">RELATUS</div><button class="secondary btn" style="padding:7px 10px" data-nav="help">Pomoc</button></div></div><main class="wrap">${content}</main><nav class="nav">${[['today','Dzisiaj'],['chat','Rozmowa'],['relation','Relacja'],['self','JA'],['history','Historia']].map(([k,l])=>`<button class="${active===k?'active':''}" data-nav="${k}">${l}</button>`).join('')}</nav>`}
function onboarding(){root().innerHTML=`<main class="wrap hero" style="padding-bottom:28px"><div class="photo"><img src="rela.jpg" alt="Rela — Asystentka Relacji Partnerskiej AI"><div class="photoText"><div class="eyebrow">RELATUS · AI</div><h1>Rela</h1><div>Asystentka Relacji Partnerskiej</div><button class="btn" style="margin-top:10px;background:rgba(255,255,255,.16);color:white;border:1px solid rgba(255,255,255,.4)" data-action="welcome">▶ Posłuchaj powitania</button></div></div><section><h2>Możemy zacząć od jednej rozmowy.</h2><p class="tiny" style="font-size:1rem">Powiedz albo napisz, co wydarzyło się ostatnio między Wami. Na tym etapie budujemy aplikację; agent AI nie jest jeszcze podłączony.</p></section><section class="card stack"><div class="notice"><strong>Rozmawiasz z systemem AI w trybie aplikacji testowej.</strong><br>Rela nie diagnozuje partnera i nie wydaje werdyktów o związku.</div><div class="field"><label>Jak nazwać tę relację? Możesz użyć pseudonimu.</label><input id="relation" placeholder="np. Ania / mój partner / nasza relacja"></div><label class="tiny"><input type="checkbox" id="consent"> Rozumiem, że Rela jest AI i chcę rozpocząć prywatną rozmowę.</label><div class="entry"><button class="btn primary" data-action="enterVoice">🎙 Powiedz</button><button class="btn secondary" data-action="enterText">✎ Napisz</button></div></section></main>`}
function avatar(){return `<img class="avatar" src="rela.jpg" alt="Rela">`}
function today(){const last=[...state.messages].reverse().find(m=>m.role==='rela')?.text;nav(`<div class="eyebrow">Dzisiaj</div><section class="relaFocus stack"><div class="relaHead">${avatar()}<div><strong>Rela</strong><div class="tiny">Asystentka Relacji Partnerskiej · AI</div></div></div><h2>${state.safety?'Najpierw bezpieczeństwo.':last?'Możemy wrócić tam, gdzie skończyliśmy.':'Od czego chcesz dziś zacząć?'}</h2><p>${state.safety?'W rozmowie pojawił się sygnał wymagający zatrzymania zwykłej pracy nad relacją.':last?esc(last):'Możesz opowiedzieć jedną konkretną sytuację. Nie musisz od razu wyjaśniać całej relacji.'}</p><div class="entry"><button class="btn primary" data-nav="chat">Porozmawiaj</button><button class="btn secondary" data-nav="self">KOMPAS JA</button></div></section><section class="card" style="margin-top:12px"><div class="eyebrow">Obraz relacji</div><p><strong>${state.pattern?'Jest hipoteza wzorca do dalszej obserwacji.':'Jeszcze za mało danych do wzorca.'}</strong></p><p class="tiny">Radar buduje się z historii, kontrdowodów i rezultatów — bez score i rankingu związku.</p></section>`,'today')}
function demoReply(input){const t=input.toLowerCase();if(/bije|uderz|grozi|zabije|samobój|samoboj|gwałt|gwalt|przemoc|stalking|boję się wrócić|boje sie wrocic/.test(t)){state.safety=true;state.stage='safety';return 'To, co opisujesz, może dotyczyć bezpieczeństwa. Zatrzymuję zwykłą pracę nad relacją. Czy w tej chwili Ty albo ktoś bliski jesteście bezpośrednio zagrożeni?'}if(state.stage==='safety')return 'Priorytetem jest teraz bezpieczeństwo. Jeśli możesz odpowiedzieć bezpiecznie: czy jesteś teraz w miejscu, w którym nie grozi Ci bezpośrednie niebezpieczeństwo?';if(state.stage==='replay'){state.events.unshift({type:'Zdarzenie',text:input,date:'Dzisiaj'});state.stage='analysis';return 'Traktuję to jako Twój opis zdarzenia i nie dopowiadam intencji drugiej osoby. Co dokładnie wydarzyło się tuż przed tym momentem?'}if(state.stage==='analysis'){state.stage='pattern';return 'Co wtedy poczułeś i jak zareagowałeś?'}if(state.stage==='pattern'){state.stage='why';return 'Czy podobny układ zdarzał się wcześniej, choćby w trochę innej sytuacji?'}if(state.stage==='why'){if(!/nie|pierwszy raz|jednoraz/.test(t))state.pattern='W napięciu może pojawiać się powtarzalny sposób reagowania wymagający dalszej obserwacji.';else state.counter.unshift('Użytkownik wskazał, że sytuacja nie jest częsta.');state.stage='rehearsal';return 'Co w takich chwilach jest dla Ciebie najważniejsze: być usłyszanym, zachować granicę, uspokoić rozmowę czy coś innego?'}if(state.stage==='rehearsal'){state.stage='verify';return 'Możesz spróbować jednego spokojnego zdania: „Chcę wrócić do tego bez kłótni. Najpierw chcę powiedzieć, co było dla mnie ważne.” Jak brzmi to po Twojemu?'}state.stage='replay';return 'Zapisuję to jako materiał z tej konkretnej sytuacji, nie jako prawdę o całym związku. Co dziś jest dla Ciebie najważniejsze?'}
function chat(){const msgs=state.messages.length?state.messages:[{role:'rela',text:'Możesz po prostu opowiedzieć, co się wydarzyło. Zacznij od jednego konkretnego momentu.'}];nav(`<div class="relaHead">${avatar()}<div><div class="eyebrow">Rela · AI</div><h2 style="margin:2px 0">Rozmowa</h2></div></div><p class="tiny">Aplikacja testowa. Jedno pytanie na raz; bez diagnozy i bez werdyktu.</p><section class="chat">${msgs.map(m=>`<div><div class="meta">${m.role==='rela'?'Rela · AI':'Ty'}</div><div class="msg ${m.role}">${esc(m.text)}</div></div>`).join('')}</section><section class="composer"><div class="composerRow"><button class="round mic" data-action="voice" data-target="chatInput">🎙</button><textarea id="chatInput" rows="1" placeholder="Napisz albo użyj głosu…"></textarea><button class="round send" data-action="send">➤</button></div><div class="voiceStatus">Dotknij mikrofonu, aby mówić.</div></section>`,'chat')}
function relation(){nav(`<div class="eyebrow">Relacja</div><h2>To, co wynika z historii — nie ocena związku.</h2><section class="tiles"><button class="tile" data-action="radar"><strong>Radar jakościowy</strong><small>Kierunek w czasie, bez score</small></button><button class="tile" data-action="patterns"><strong>Wzorce i kontrdowody</strong><small>Co się powtarza, a co temu przeczy</small></button><button class="tile"><strong>Działania</strong><small>Mikro-krok → rezultat</small></button><button class="tile"><strong>Mirror</strong><small>Przewidywanie kontra rezultat</small></button></section><section class="card" style="margin-top:12px"><div class="eyebrow">Co działało</div><p>${state.positive[0]||'Jeszcze brak wystarczających danych.'}</p></section>`,'relation')}
function selfScreen(){const q=['Kim jesteś dziś w tej relacji — szczególnie wtedy, gdy robi się trudno?','Kim chcesz być w tej relacji, gdy pojawia się napięcie?','Czego nie chcesz stale doświadczać?','Jaka wartość jest dla Ciebie najważniejsza?','Jakiej potrzeby najczęściej bronisz?','Jaka granica jest dla Ciebie ważna?','Jakie zachowanie partnera ma dziś największe znaczenie?','Co chcesz zachować w tej relacji?'];const n=state.compass.length;nav(`<div class="eyebrow">KOMPAS JA</div><h2>Rozmowa o Tobie, nie formularz.</h2><section class="card stack"><p><strong>${esc(q[Math.min(n,q.length-1)])}</strong></p><div class="composerRow"><button class="round mic" data-action="voice" data-target="compassInput">🎙</button><textarea id="compassInput" rows="1" placeholder="Odpowiedz Relie…"></textarea><button class="round send" data-action="compassSend">➤</button></div><div class="voiceStatus">Możesz odpowiedzieć głosem lub tekstem.</div></section>${state.compass.length?`<section class="card" style="margin-top:12px"><div class="eyebrow">Zapisane odpowiedzi</div>${state.compass.map((x,i)=>`<div class="row"><span>${i+1}. ${esc(x)}</span></div>`).join('')}</section>`:''}`,'self')}
function history(){nav(`<div class="eyebrow">Historia</div><h2>Zdarzenia i rezultaty, nie etykiety.</h2><section class="card timeline">${state.events.length?state.events.map(e=>`<article class="event"><div class="tiny">${e.date} · ${e.type}</div><strong>${esc(e.text)}</strong></article>`).join(''):'<div class="tiny">Jeszcze nie ma zapisanych zdarzeń.</div>'}</section>`,'history')}
function help(){nav(`<div class="eyebrow">Pomoc i bezpieczeństwo</div><h2>Safety ma pierwszeństwo przed pracą nad relacją.</h2><section class="card stack"><div class="notice" style="border-left-color:var(--danger);background:#fff3f3"><strong>W sytuacji bezpośredniego zagrożenia</strong><br>Skorzystaj z lokalnych służb ratunkowych lub zweryfikowanego źródła pomocy. RELATUS nie kontaktuje służb samodzielnie.</div><div class="row"><strong>Przemoc / groźby / przymus</strong><span class="pill">safety</span></div><div class="row"><strong>Myśli samobójcze / samouszkodzenie</strong><span class="pill">safety</span></div><div class="row"><strong>Specjalista</strong><span class="pill">po decyzji użytkownika</span></div></section>`,'help')}
function openSheet(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><section class="sheet"><button class="close" data-action="close">✕</button>${html}</section></div>`)}
function render(){if(!state.onboarded)return onboarding();({today,chat,relation,self:selfScreen,history,help}[state.screen]||today)()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-action]');if(!t)return;if(t.dataset.nav){state.screen=t.dataset.nav;save();document.querySelector('#modal')?.remove();return render()}const a=t.dataset.action;if(a==='welcome'){speak('Cześć. Jestem Rela. Możesz mi powiedzieć albo napisać, co wydarzyło się ostatnio między Wami. Zaczniemy od jednej konkretnej sytuacji.');return}if(a==='enterVoice'||a==='enterText'){if(!$('#consent')?.checked)return toast('Potwierdź, że rozumiesz, że Rela jest AI.');state.onboarded=true;state.relation=$('#relation')?.value.trim()||'Moja relacja';state.screen='chat';save();render();if(a==='enterVoice')setTimeout(()=>listen('chatInput'),250);return}if(a==='voice'){listen(t.dataset.target);return}if(a==='send'){const x=$('#chatInput'),input=x?.value.trim();if(!input)return;const reply=demoReply(input);state.messages.push({role:'user',text:input},{role:'rela',text:reply});save();render();speak(reply);setTimeout(()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),10);return}if(a==='compassSend'){const input=$('#compassInput')?.value.trim();if(!input)return;state.compass.push(input);save();render();speak('Dobrze. Traktuję to jako Twoją perspektywę, którą możesz później zmienić.');return}if(a==='radar')return openSheet(`<div class="eyebrow">Radar relacji</div><h2>Jakościowy kierunek</h2><p class="tiny">Porównuje relację wyłącznie z jej własną historią.</p><div class="card"><div class="row"><strong>Komunikacja</strong><span class="pill">${state.events.length?'obserwacja rozpoczęta':'za mało danych'}</span></div><div class="row"><strong>Zaufanie</strong><span class="pill">za mało danych</span></div><div class="row"><strong>Granice</strong><span class="pill">za mało danych</span></div><div class="row"><strong>Bliskość</strong><span class="pill">za mało danych</span></div></div>`);if(a==='patterns')return openSheet(`<div class="eyebrow">Wzorce i kontrdowody</div><h2>Wzorzec nie powstaje z jednego zdarzenia.</h2><div class="card stack"><div><strong>Kandydat</strong><p>${esc(state.pattern||'Brak podstaw do nazwania wzorca.')}</p></div><div><strong>Kontrdowody</strong><p>${esc(state.counter[0]||'Brak zapisanych kontrdowodów.')}</p></div></div>`);if(a==='close')return $('#modal')?.remove()});
render();
</script></body></html>
