<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1ea"><title>RELATUS — Rela</title><style>:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#1f2522;--muted:#6e756f;--line:#ddd5ca;--green:#293b34;--danger:#9b3b3b;--shadow:0 18px 44px rgba(34,40,36,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(760px,100%);margin:auto;padding:16px 14px 100px}.top{position:sticky;top:0;z-index:20;background:rgba(245,241,234,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{width:min(760px,100%);margin:auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.08em}.topactions{display:flex;align-items:center;gap:8px}.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-weight:800}.tiny{font-size:.78rem;color:var(--muted)}.heroPhoto{position:relative;overflow:hidden;border-radius:28px;min-height:420px;background:#ddd;box-shadow:var(--shadow)}.heroPhoto img{width:100%;height:420px;object-fit:cover;object-position:center 38%;display:block}.heroPhoto:after{content:'';position:absolute;inset:38% 0 0;background:linear-gradient(transparent,rgba(24,31,28,.84))}.heroText{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}h1{font-size:clamp(2rem,7vw,2.7rem);line-height:1.08;margin:6px 0}h2{line-height:1.15}.eyebrow{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.stack{display:grid;gap:12px}.btn{border:0;border-radius:15px;padding:12px 15px;font-weight:800}.primary{background:var(--green);color:white}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.textbtn{border:0;background:transparent;color:var(--green);font-weight:800;padding:5px}.danger{background:#fff4f4;color:var(--danger);border:1px solid #e4c6c6}.entry{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:6px}.field input,.composer textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;outline:none}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,249,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);font-size:.72rem;padding:6px 2px}.nav button.active{color:var(--green);font-weight:900}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:center 34%;border:2px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.15)}.head{display:flex;gap:11px;align-items:center}.chat{display:grid;gap:12px;margin:14px 0}.msg{max-width:88%;padding:12px 14px;border-radius:18px;white-space:pre-wrap}.user{justify-self:end;background:var(--green);color:white;border-bottom-right-radius:6px}.rela{justify-self:start;background:white;border:1px solid var(--line);border-bottom-left-radius:6px}.meta{font-size:.7rem;color:var(--muted);margin:0 6px -6px}.composer{position:sticky;bottom:82px;background:rgba(255,253,249,.98);border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:var(--shadow)}.composerRow{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:end}.round{width:46px;height:46px;border:0;border-radius:14px}.mic{background:#ece7df}.mic.live{background:#f4dddd;color:var(--danger);box-shadow:0 0 0 4px rgba(155,52,52,.08)}.send{background:var(--green);color:#fff}.status{font-size:.76rem;color:var(--muted);padding:5px 5px 0}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:14px;border:1px solid var(--line);border-radius:18px;background:white;text-align:left}.tile small{display:block;color:var(--muted);margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{font-size:.75rem;padding:5px 9px;border-radius:999px;background:#eee7df}.modal{position:fixed;inset:0;z-index:100;background:rgba(15,20,18,.45);display:grid;place-items:end center}.sheet{width:min(680px,100%);max-height:85dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 28px}.close{float:right;border:0;background:#e9e3da;border-radius:10px;padding:7px 10px}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:120;background:#202622;color:white;padding:10px 14px;border-radius:12px;max-width:90vw}.notice{border-left:4px solid #4d725d;background:#f1f6f2;border-radius:12px;padding:11px 13px}@media(max-width:620px){.heroPhoto{min-height:390px}.heroPhoto img{height:390px}.tiles{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>/* bundled bilingual RELATUS V2.2; avatar embedded as data URI */</script><script src="data:text/javascript;base64,"></script></body></html>
