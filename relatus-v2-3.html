<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RELATUS — Rela</title><style>:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#202521;--muted:#6f756f;--line:#ded7cc;--green:#26372f;--danger:#9b3c3c;--shadow:0 14px 38px rgba(33,40,36,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.app{padding-bottom:86px}.page{width:min(760px,100%);margin:auto;padding:16px 14px 28px}.top{position:sticky;top:0;z-index:30;background:rgba(245,241,234,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{width:min(760px,100%);margin:auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.actions{display:flex;gap:6px}.link,.lang{border:0;background:transparent;color:var(--green);font-weight:800;padding:8px}.lang{background:#fff;border:1px solid var(--line);border-radius:10px}.hero{position:relative;overflow:hidden;border-radius:28px;min-height:410px;background:#ddd;box-shadow:var(--shadow)}.hero img{width:100%;height:410px;object-fit:cover;object-position:center 26%;display:block}.hero:after{content:'';position:absolute;inset:42% 0 0;background:linear-gradient(transparent,rgba(20,28,24,.86))}.heroText{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}.heroText h1{font-size:2.5rem;margin:5px 0}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;font-weight:850;color:var(--muted)}.heroText .eyebrow{color:#eee}.stage{display:inline-flex;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:.75rem;font-weight:800;color:var(--green)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.stack{d =='pl'?'pl':'en';root().innerHTML=`<div class="app"><div class="top"><div class="topin"><div class="brand">RELATUS</div><div class="actions"><button class="lang" data-a="lang">${s.lang==='pl'?'EN':'PL'}</button><button class="link" data-n="help">${tr('help')}</button><button class="link" data-n="settings">${tr('account')}</button></div></div></div><main class="page">${c}</main><nav class="nav">${[['today',tr('today')],['chat',tr('chat')],['relationship',tr('relationship')],['me',tr('me')],['history',tr('history')]].map(([k,l])=>`<button class="${a===k?'active':''}" data-n="${k}">${l}</button>`).join('')}</nav></div>`}function onboard(){document.documentElement.lang=s.lang==='pl'?'pl':'en';root().innerHTML=`<main class="page stack"><div style="display:flex;justify-content:space-between"><span class="stage">${tr('stage')}</span><button class="lang" data-a="lang">${s.lang==='pl'?'EN':'PL'}</button></div><div class="hero"><img src="rela.jpg" alt="Rela" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/wodnik1971/evo/relatus-preview-20260930/rela.jpg'"><div class="heroText"><div class="eyebrow">RELATUS · AI</div><h1>Rela</h1><div>${tr('assistant')}</div><button class="btn" style="margin-top:10px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)" data-a="welcome">${tr('welcome')}</button></div></div><section><h2>${tr('start')}</h2><p class="muted">${tr('desc')}</p></section><section class="card stack"><div class="field"><label>${tr('relation')}</label><input id="rel" placeholder="${tr('relph')}"></div><label class="small"><input id="cons" type="checkbox"> ${tr('consent')}</label><div class="entry"><button class="btn primary" data-a="enterVoice">${tr('say')}</button><button class="btn secondary" data-a="enterText">${tr('write')}</button></div><button class="link" data-a="privacy">${tr('privacy')}</button></section></main>`}function today(){let last=[...s.msgs].reverse().find(x=>x.r==='rela')?.t;shell(`<div class="eyebrow `<h2>${tr('patterns')}</h2><p>${tr('patternsSub')}</p>`);if(a==='actions')return sheet(`<h2>${tr('actions')}</h2><p>${tr('actionsSub')}</p>`);if(a==='mirror')return sheet(`<h2>${tr('mirror')}</h2><p>${tr('mirrorSub')}</p>`);if(a==='privacy')return sheet(`<h2>${tr('privacy')}</h2><p>${tr('settingsDesc')}</p>`);if(a==='memory')return sheet(`<h2>${tr('memory')}</h2><p>${tr('settingsDesc')}</p>`);if(a==='close')return $('#modal')?.remove();if(a==='export'){let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='relatus-demo.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),300);return}if(a==='reset'){localStorage.removeItem(K);location.reload()}});render();</script></body></html>
