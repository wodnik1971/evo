<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RELATUS — Rela</title><style>:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#1f2522;--muted:#6f756f;--line:#ddd6cb;--green:#26352f;--green2:#60776b;--danger:#9b3434;--ok:#4e725d;--shadow:0 14px 38px rgba(35,39,36,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea{font:inherit}.page{width:min(760px,100%);margin:auto;padding:18px 14px 100px}.top{position:sticky;top:0;z-index:20;background:rgba(245,241,234,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topin{width:min(760px,100%);margin:auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.btn{border:0;border-radius:15px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.text{background:transparent;color:var(--green);padding:4px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.stack{display:grid;gap:12px}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:800}.muted{color:var(--muted)}.small{font-size:.82rem}.hero{position:relative;overflow:hidden;border-radius:28px;min-height:420px;background:#ddd;box-shadow:var(--shadow)}.hero img{width:100%;height:420px;object-fit:cover;object-position:center 24%;display:block}.hero:after{content:'';position:absolute;inset:38% 0 0;background:linear-gradient(transparent,rgba(19,26,23,.82))}.heroText{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}.heroText h1{font-size:2.4rem;margin:4px 0}.stage{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:.74rem;font-weight:800;color:var(--green)}.entry{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:6px}.field input{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,249,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);font-size:.7rem;padding:6px 2px}.nav .active{color:var(--green);font-weight:900}.head{display:flex;align-items:center;gap:11px}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.12)}h1,h2{line-height:1.12}.chat{display:grid;gap:11px;margin:15px 0}.meta{font-size:.7rem;color:var(--muted);margin:0 6px -5px}.msg{max-width:88%;padding:12px 14px;border-radius:18px;white-space:pre-wrap}.user{justify-self:end;background:var(--green);color:#fff;border-bottom-right-radius:6px}.rela{justify-self:start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}.composer{position:sticky;bottom:82px;background:#fffdf9;border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:var(--shadow)}.composerRow{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:end}.round{width:46px;height:46px;border:0;border-radius:14px;cursor:pointer}.mic{background:#ece6dc}.mic.live{background:#f3dddd;color:var(--danger);box-shadow:0 0 0 4px rgba(155,52,52,.08)}.send{background:var(--green);color:#fff}.composer textarea{border:0;outline:none;resize:none;background:transparent;padding:10px 4px;min-height:46px}.status{font-size:.76rem;color:var(--muted);padding:3px 4px 0}.status.live{color:var(--danger);font-weight:800}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;text-align:left;cursor:pointer}.tile small{display:block;color:var(--muted);margin-top:4px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{font-size:.75rem;background:#ece6dc;border-radius:999px;padding:5px 8px}.timeline{display:grid;gap:12px}.event{border-left:3px solid var(--line);padding-left:12px}.modal{position:fixed;inset:0;z-index:100;background:rgba(15,20,18,.45);display:grid;place-items:end center}.sheet{width:min(680px,100%);max-height:86dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 28px}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:120;background:#202622;color:#fff;padding:10px 14px;border-radius:12px}@media(max-width:620px){.tiles{grid-template-columns:1fr}.hero{min-height:390px}.hero img{height:390px}}</style></head><body><div id="app"></div><script>const KEY='relatus_v2_app_stage';const base={on:false,screen:'today',relation:'Moja relacja',messages:[],events:[],compass:[],pattern:'',action:null,prediction:'',outcome:'',voice:true};let s={...base};try{s={...s,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const $=q=>document.querySelector(q),root=()=>$('#app'),save=()=>localStorage.setItem(KEY,JSON.stringify(s)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}function speak(t){if(!s.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';u.rate=.96;speechSynthesis.speak(u)}catch{}}let rec=null;function listen(id){if(rec){try{rec.stop()}catch{}return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Rozpoznawanie mowy wymaga Chrome lub Edge.');const input=document.getElementById(id);if(!input)return;rec=new SR();rec.lang='pl-PL';rec.interimResults=true;const mic=document.querySelector('.mic'),st=document.querySelector('.status');mic?.classList.add('live');if(mic)mic.textContent='■';st?.classList.add('live');if(st)st.textContent='Słucham… dotknij ■, aby zakończyć.';rec.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const x=e.results[n][0].transcript;e.results[n].isFinal?f+=x:i+=x}input.value=(f||i).trim()};rec.onerror=e=>{if(st)st.textContent=e.error==='not-allowed'?'Brak zgody na mikrofon.':'Nie udało się rozpoznać mowy.'};rec.onend=()=>{rec=null;mic?.classList.remove('live');if(mic)mic.textContent='🎙';st?.classList.remove('live');if(st)st.textContent=input.value.trim()?'Sprawdź tekst i wyślij.':'Dotknij mikrofonu, aby mówić.'};try{rec.start()}catch{rec=null}}function shell(content,active){root().innerHTML=`<div class="top"><div class="topin"><div class="brand">RELATUS</div><div><button class="btn text" data-nav="help">Pomoc</button> <button class="btn text" data-nav="settings">Konto</button></div></div></div><main class="page">${content}</main><nav class="nav">${[['today','Dzisiaj'],['chat','Rozmowa'],['relation','Relacja'],['self','JA'],['history','Historia']].map(([k,l])=>`<button class="${active===k?'active':''}" data-nav="${k}">${l}</button>`).join('')}</nav>`}function avatar(){return '<img class="avatar" src="rela.jpg" alt="Rela">'}function onboarding(){root().innerHTML=`<main class="page stack" style="padding-bottom:30px"><span class="stage">RELATUS · etap APLIKACJA</span><div class="hero"><img src="rela.jpg" alt="Rela"><div class="heroText"><div class="eyebrow" style="color:#eee">RELATUS · AI</div><h1>Rela</h1><div>Asystentka Relacji Partnerskiej</div><button class="btn" style="margin-top:10px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)" data-action="welcome">▶ Posłuchaj powitania</button></div></div><section><h2>Powiedz, co się wydarzyło.</h2><p class="muted">Możesz mówić albo pisać. Zaczniemy od jednej konkretnej sytuacji — bez testu i bez oceniania związku.</p></section><section class="card stack"><div class="field"><label>Jak nazwać tę relację? Możesz użyć pseudonimu.</label><input id="relation" placeholder="np. Ania / mój partner / nasza relacja"></div><label class="small"><input id="consent" type="checkbox"> Rozumiem, że Rela jest AI i chcę rozpocząć prywatną rozmowę.</label><div class="entry"><button class="btn primary" data-action="enterVoice">🎙 Powiedz</button><button class="btn secondary" data-action="enterText">✎ Napisz</button></div><button class="btn text" data-action="privacy">Prywatność, dane i granice systemu</button></section></main>`}function today(){const last=[...s.messages].reverse().find(x=>x.role==='rela')?.text;shell(`<div class="eyebrow">Dzisiaj</div><section class="card stack"><div class="head">${avatar()}<div><strong>Rela</strong><div class="small muted">Asystentka Relacji Partnerskiej · AI</div></div></div><h2>${s.action?'Chcesz powiedzieć, jak poszło?':last?'Możemy wrócić tam, gdzie skończyliśmy.':'Od czego chcesz dziś zacząć?'}</h2><p>${s.action?esc(s.action.text):last?esc(last):'Opowiedz jedną konkretną sytuację. Nie musisz wyjaśniać całej relacji.'}</p><div class="entry"><button class="btn primary" data-nav="chat">Porozmawiaj</button><button class="btn secondary" data-nav="self">KOMPAS JA</button></div></section>`,'today')}function reply(input){const t=input.toLowerCase();if(/bije|uderz|grozi|zabije|samobój|samoboj|gwałt|gwalt|przemoc|stalking/.test(t))return 'To, co opisujesz, może dotyczyć bezpieczeństwa. Zatrzymuję zwykłą pracę nad relacją. Czy w tej chwili Ty albo ktoś bliski jesteście bezpośrednio zagrożeni?';s.events.unshift({date:'Dzisiaj',text:input,type:'Rozmowa'});if(!s.pattern&&s.events.length>1)s.pattern='W napięciu może pojawiać się powtarzalny sposób reagowania — to hipoteza do dalszej obserwacji.';if(!s.action){s.prediction='Powrót do tematu może zwiększyć napięcie.';s.action={text:'Wrócić do jednej ważnej sprawy spokojnym komunikatem, bez próby rozstrzygnięcia wszystkiego naraz.',status:'planned'};return 'Dziękuję. Traktuję to jako Twój opis, bez dopowiadania intencji partnera. Co było dla Ciebie w tej sytuacji najważniejsze?'}s.outcome=input;s.action.status='done';return 'Zapisuję rezultat tej jednej sytuacji, nie jako regułę o całym związku. Co z tego wynika dla Ciebie?'}function chat(){const msgs=s.messages.length?s.messages:[{role:'rela',text:'Możesz po prostu opowiedzieć, co się wydarzyło. Zacznij od jednego konkretnego momentu.'}];shell(`<div class="head">${avatar()}<div><div class="eyebrow">Rela · AI</div><h2 style="margin:2px 0">Rozmowa</h2></div></div><p class="small muted">Jedno pytanie na raz. Agent docelowy nie jest jeszcze podłączony — to warstwa aplikacji.</p><section class="chat">${msgs.map(m=>`<div><div class="meta">${m.role==='rela'?'Rela · AI':'Ty'}</div><div class="msg ${m.role}">${esc(m.text)}</div></div>`).join('')}</section><section class="composer"><div class="composerRow"><button class="round mic" data-action="voice" data-input="chatInput">🎙</button><textarea id="chatInput" rows="1" placeholder="Powiedz lub napisz…"></textarea><button class="round send" data-action="send">➤</button></div><div class="status">Dotknij mikrofonu, aby mówić.</div></section>`,'chat')}function relation(){shell(`<div class="eyebrow">Relacja</div><h2>Obraz zmian, nie ocena związku.</h2><section class="tiles"><button class="tile" data-action="radar"><strong>Radar jakościowy</strong><small>Kierunek w czasie, bez score</small></button><button class="tile" data-action="patterns"><strong>Wzorce i kontrdowody</strong><small>Co się powtarza, a co temu przeczy</small></button><button class="tile" data-action="actions"><strong>Działania</strong><small>Przed → działanie → po</small></button><button class="tile" data-action="mirror"><strong>Mirror</strong><small>Przewidywanie kontra rezultat</small></button></section>`,'relation')}function selfScreen(){const qs=['Kim jesteś dziś w tej relacji — szczególnie gdy robi się trudno?','Kim chcesz być, gdy pojawia się napięcie?','Czego nie chcesz stale doświadczać?','Jaka wartość jest dla Ciebie najważniejsza?','Jakiej potrzeby najczęściej bronisz?','Jaka granica jest dla Ciebie ważna?'];shell(`<div class="eyebrow">KOMPAS JA</div><h2>Rozmowa o Tobie, nie formularz.</h2><section class="card stack"><strong>${esc(qs[Math.min(s.compass.length,qs.length-1)])}</strong><div class="composerRow"><button class="round mic" data-action="voice" data-input="compassInput">🎙</button><textarea id="compassInput" rows="1" placeholder="Odpowiedz Relie…"></textarea><button class="round send" data-action="compassSend">➤</button></div><div class="status">Możesz odpowiedzieć głosem lub tekstem.</div></section>`,'self')}function history(){shell(`<div class="eyebrow">Historia</div><h2>Zdarzenia i rezultaty, nie etykiety.</h2><section class="card timeline">${s.events.length?s.events.map(e=>`<article class="event"><div class="small muted">${e.date} · ${e.type}</div><strong>${esc(e.text)}</strong></article>`).join(''):'<div class="muted">Jeszcze nie ma zapisanych zdarzeń.</div>'}</section>`,'history')}function help(){shell(`<div class="eyebrow">Pomoc i bezpieczeństwo</div><h2>Safety ma pierwszeństwo.</h2><section class="card stack"><p><strong>Przemoc, groźby, przymus, samouszkodzenie lub zagrożenie życia:</strong> zwykła praca nad relacją zostaje zatrzymana.</p><p class="muted">W bezpośrednim zagrożeniu skorzystaj z lokalnych służb ratunkowych lub zweryfikowanego źródła pomocy.</p></section>`,'help')}function settings(){shell(`<div class="eyebrow">Konto i prywatność</div><h2>Kontrola należy do użytkownika.</h2><section class="card"><div class="row"><div><strong>Rela jest AI</strong><div class="small muted">Jawne od pierwszego kontaktu</div></div><span class="pill">aktywne</span></div><div class="row"><div><strong>Głos Reli</strong><div class="small muted">Odczytywanie odpowiedzi przez urządzenie</div></div><input type="checkbox" data-action="toggleVoice" ${s.voice?'checked':''}></div><div class="row"><div><strong>Tryb MY</strong><div class="small muted">Nie łączy prywatnych danych automatycznie</div></div><span class="pill">nieaktywny</span></div></section><section class="card stack" style="margin-top:12px"><button class="btn secondary" data-action="export">Eksport danych demo</button><button class="btn secondary" data-action="privacy">Pamięć i dane</button><button class="btn" style="color:var(--danger);background:#fff;border:1px solid #e0bcbc" data-action="reset">Zresetuj prototyp</button></section>`,'settings')}function sheet(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><section class="sheet"><button class="btn secondary" data-action="close" style="float:right">✕</button>${html}</section></div>`)}function render(){if(!s.on)return onboarding();({today,chat,relation,self:selfScreen,history,help,settings}[s.screen]||today)()}document.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-action]');if(!t)return;if(t.dataset.nav){s.screen=t.dataset.nav;save();$('#modal')?.remove();return render()}const a=t.dataset.action;if(a==='welcome')return speak('Cześć. Jestem Rela. Możesz mi powiedzieć albo napisać, co wydarzyło się ostatnio między Wami. Zaczniemy od jednej konkretnej sytuacji.');if(a==='enterVoice'||a==='enterText'){if(!$('#consent')?.checked)return toast('Potwierdź, że rozumiesz, że Rela jest AI.');s.on=true;s.relation=$('#relation')?.value.trim()||'Moja relacja';s.screen='chat';save();render();if(a==='enterVoice')setTimeout(()=>listen('chatInput'),220);else setTimeout(()=>$('#chatInput')?.focus(),100);return}if(a==='voice')return listen(t.dataset.input);if(a==='send'){const x=$('#chatInput'),v=x?.value.trim();if(!v)return;const r=reply(v);s.messages.push({role:'user',text:v},{role:'rela',text:r});save();render();speak(r);return}if(a==='compassSend'){const v=$('#compassInput')?.value.trim();if(!v)return;s.compass.push(v);save();render();return speak('Dobrze. Traktuję to jako Twoją perspektywę, którą możesz później zmienić.')}if(a==='radar')return sheet(`<div class="eyebrow">Radar jakościowy</div><h2>Kierunek w czasie</h2><div class="card"><div class="row"><strong>Komunikacja</strong><span class="pill">${s.events.length?'obserwacja rozpoczęta':'za mało danych'}</span></div><div class="row"><strong>Zaufanie</strong><span class="pill">za mało danych</span></div><div class="row"><strong>Granice</strong><span class="pill">za mało danych</span></div><div class="row"><strong>Bliskość</strong><span class="pill">za mało danych</span></div></div><p class="muted small">Bez score, benchmarku i prognozy rozwodu.</p>`);if(a==='patterns')return sheet(`<div class="eyebrow">Wzorce i kontrdowody</div><h2>Nie z jednego zdarzenia.</h2><div class="card"><strong>${esc(s.pattern||'Jeszcze brak podstaw do nazwania wzorca.')}</strong></div>`);if(a==='actions')return sheet(`<div class="eyebrow">Działania</div><h2>Mały krok, potem rezultat</h2>${s.action?`<div class="card"><strong>${esc(s.action.text)}</strong><p class="muted small">Status: ${s.action.status}</p><button class="btn primary" data-action="verify">Powiedz, jak poszło</button></div>`:'<div class="card muted">Nie ma jeszcze zaplanowanego działania.</div>'}`);if(a==='verify'){$('#modal')?.remove();s.screen='chat';s.messages.push({role:'rela',text:'Jak poszło z ostatnim małym krokiem? Nie ma problemu, jeśli go nie wykonałeś.'});save();return render()}if(a==='mirror')return sheet(`<div class="eyebrow">Mirror</div><h2>Przewidywanie kontra rezultat</h2>${s.outcome?`<div class="card"><strong>Przed</strong><p>${esc(s.prediction)}</p><strong>Po</strong><p>${esc(s.outcome)}</p></div>`:'<div class="card muted">Mirror pojawi się po realnym działaniu i zapisanym rezultacie.</div>'}`);if(a==='privacy')return sheet(`<div class="eyebrow">Prywatność i dane</div><h2>Minimalizacja i kontrola.</h2><p>Ta wersja przechowuje dane demo wyłącznie lokalnie w przeglądarce. Produkcyjny backend, baza danych i agent AI nie są jeszcze podłączone.</p><div class="card"><strong>Użytkownik może:</strong><p class="muted">zobaczyć · wyeksportować · zresetować dane demo</p></div>`);if(a==='toggleVoice'){s.voice=!!t.checked;save();if(!s.voice&&'speechSynthesis'in window)speechSynthesis.cancel();return}if(a==='export'){const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='relatus-demo.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),200);return}if(a==='reset'){if(confirm('Zresetować lokalne dane demo?')){localStorage.removeItem(KEY);location.reload()}return}if(a==='close')return $('#modal')?.remove()});render();</script></body></html>
